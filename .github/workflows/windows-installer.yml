name: Windows Installer

# Builds the plugin on Windows (MSVC), runs the DSP test suite, and produces a
# Windows installer (.exe, Inno Setup) plus a portable .zip. Artifacts are
# attached to every run; pushing a tag like v1.0.0 also creates a GitHub Release
# with the installer attached.

on:
  push:
    branches: [ main, 'claude/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Set (e.g. v1.0.0) to publish a public GitHub Release with the installer attached. Leave blank for artifacts only."
        required: false
        default: ""

# A public Release is published when any of these hold:
#   * a tag  v*  is pushed
#   * this workflow is dispatched with a release_tag input
#   * a pushed commit's message contains a marker like  [release v1.0.0]
# The last path exists because some environments can push branches but not tags
# or dispatch workflows; the runner's own token creates the tag+release.

permissions:
  contents: write        # needed to attach the installer to a release on tags

# Cancel superseded runs for the same ref (e.g. rapid PR pushes).
concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Use the Ninja generator + MSVC dev environment rather than the VS
      # generator: it is immune to runner-image VS-version drift and produces
      # the same artefact layout (TurboTubes_artefacts/Release/…) the installer
      # expects.
      - name: Set up MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja --no-progress -y

      - name: Configure (CMake · Ninja · MSVC)
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTT_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel --target TurboTubes_VST3 TurboTubes_Standalone turbo_dsp_tests

      - name: Run DSP test suite
        run: ctest --test-dir build --output-on-failure

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      # Resolve whether this run publishes a Release, and under what tag.
      # Inputs come via env vars (not inline interpolation) to stay injection-safe.
      - name: Resolve release
        id: rel
        shell: pwsh
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          $tag = ""
          if ($env:REF -like "refs/tags/v*")        { $tag = $env:REF_NAME }
          elseif ($env:INPUT_TAG -ne "")            { $tag = $env:INPUT_TAG }
          elseif ($env:HEAD_MSG -match '\[release\s+(v[0-9][^\]\s]*)\]') { $tag = $Matches[1] }
          $publish = if ($tag -ne "") { "true" } else { "false" }
          "tag=$tag"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "publish=$publish" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "publish=$publish tag=$tag"

      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ steps.rel.outputs.tag }}"
          if ($tag -ne "") { $v = $tag.TrimStart("v") }
          else { $v = "1.0.0-dev+$(git rev-parse --short HEAD)" }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Version: $v"

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & "$iscc" "/DAppVersion=${{ steps.ver.outputs.version }}" `
                    "/DBuildDir=$((Resolve-Path build).Path)" `
                    "packaging\windows\TurboTubes.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }

      - name: Portable zip
        shell: pwsh
        run: |
          $dst = "TurboTubes-portable"
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item "build\TurboTubes_artefacts\Release\VST3\Turbo Tubes.vst3" "$dst\" -Recurse
          Copy-Item "build\TurboTubes_artefacts\Release\Standalone\Turbo Tubes.exe" "$dst\"
          Copy-Item "README.md","LICENSE" "$dst\"
          Compress-Archive -Path "$dst\*" `
            -DestinationPath "TurboTubes-${{ steps.ver.outputs.version }}-win64-portable.zip" -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TurboTubes-Windows-${{ steps.ver.outputs.version }}
          path: |
            packaging/windows/Output/*.exe
            TurboTubes-*-win64-portable.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ steps.rel.outputs.publish == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: TURBO TUBES ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            packaging/windows/Output/*.exe
            TurboTubes-*-win64-portable.zip
